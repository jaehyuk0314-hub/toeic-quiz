<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>토익 단어 OMR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  --paper:#F4F6F9; --sheet:#FFFFFF; --ink:#1B2433; --muted:#5E6878; --line:#E3C9D3;
  --omr:#C8375F; --omr-soft:#FBEAF0; --good:#1F8A5B; --good-soft:#E3F4EC; --bad:#C8375F;
  --shadow:0 1px 0 rgba(27,36,51,.06),0 8px 24px rgba(27,36,51,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11151C; --sheet:#1A2029; --ink:#E8ECF2; --muted:#98A2B3; --line:#4A2E3A;
    --omr:#F06A90; --omr-soft:#3A1E29; --good:#4CC790; --good-soft:#15352A; --bad:#F06A90;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11151C; --sheet:#1A2029; --ink:#E8ECF2; --muted:#98A2B3; --line:#4A2E3A;
  --omr:#F06A90; --omr-soft:#3A1E29; --good:#4CC790; --good-soft:#15352A; --bad:#F06A90;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.6;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:34px;line-height:1.1;margin:0;letter-spacing:.01em}
h1 span{color:var(--omr)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--omr);border-radius:4px;background:var(--sheet)}
.stat{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:600}
.stat small{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--sheet)}
.btn.primary{background:var(--omr);border-color:var(--omr);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--omr);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.choice:focus-visible{outline:3px solid var(--omr);outline-offset:2px}
.sheet{background:var(--sheet);border-radius:6px;box-shadow:var(--shadow);border-top:6px solid var(--omr);padding:22px 20px 20px;display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.progress{height:4px;background:var(--omr-soft);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--omr);transition:width .3s}
.word{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(28px,8vw,40px);line-height:1.15;margin:0;word-break:break-word}
.pos{display:inline-block;font-size:12px;color:var(--omr);border:1px solid var(--omr);border-radius:3px;padding:0 6px;margin-left:6px;vertical-align:middle;font-family:"IBM Plex Sans KR",sans-serif}
.choices{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--omr);background:var(--omr-soft)}
.bubble{flex:none;width:30px;height:18px;border:1.5px solid var(--omr);border-radius:50%;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--omr)}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .bubble{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{border-color:var(--bad);background:var(--omr-soft)}
.choice.wrong .bubble{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.choice:disabled{cursor:default}
.qtype{margin:-6px 0 0;color:var(--omr);font-size:13px;font-weight:700}
.sentence{font-size:clamp(18px,4.8vw,22px);font-weight:500;line-height:1.5;margin:0;word-break:break-word}
.blank{color:var(--omr);font-family:"IBM Plex Mono",monospace;font-weight:600;letter-spacing:.05em}
.choice .en{font-family:"IBM Plex Mono",monospace;font-weight:600}
.ex b{font-style:normal;color:var(--omr)}
.feedback{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.feedback .verdict{font-weight:700}
.feedback .verdict.ok{color:var(--good)} .feedback .verdict.no{color:var(--bad)}
.ex{font-style:italic;color:var(--ink)} .ex-ko{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12px}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.score{font-family:"Do Hyeon",sans-serif;font-size:64px;line-height:1;color:var(--omr)}
.missed{width:100%;text-align:left;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.missed div{display:flex;justify-content:space-between;gap:12px}
.missed .mono{font-weight:600}
.note{color:var(--muted);font-size:12px;text-align:center}
.tabs{display:flex;border-bottom:1.5px solid var(--line)}
.tab{font:inherit;font-weight:500;font-size:15px;background:none;border:0;color:var(--muted);padding:8px 16px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--omr);font-weight:700}
.tab:focus-visible,.chip:focus-visible,.meaning:focus-visible{outline:3px solid var(--omr);outline-offset:2px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:5px 12px;border-radius:4px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px}
.chip[aria-pressed="true"]{background:var(--omr);border-color:var(--omr);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.panel{display:flex;flex-direction:column;gap:20px}
.bookhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bookhead h2{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:26px;margin:0;line-height:1.2}
.bookhead .hint{display:block}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);cursor:pointer}
.toggle input{accent-color:var(--omr);width:16px;height:16px}
.book{background:var(--sheet);border-radius:6px;box-shadow:var(--shadow);border-top:6px solid var(--omr);list-style:none;margin:0;padding:4px 0}
.entry{display:grid;grid-template-columns:2.2em 1fr;gap:2px 10px;padding:12px 18px}
.entry+.entry{border-top:1px solid var(--line)}
.entry .no{grid-row:span 3;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--omr);padding-top:4px;font-variant-numeric:tabular-nums}
.entry .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.entry .w{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:17px}
.entry .pos{margin-left:0}
.tag{font-size:11px;color:var(--omr);background:var(--omr-soft);border-radius:3px;padding:0 6px}
.meaning{font:inherit;text-align:left;background:none;border:0;padding:0;color:var(--ink);cursor:default}
.hide-meaning .meaning{color:transparent;background:var(--omr-soft);border-radius:3px;cursor:pointer;min-width:6em;user-select:none}
.hide-meaning .meaning.shown{color:var(--ink);background:none}
.entry .ex{font-size:13px}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>토익 단어 <span>OMR</span></h1>
      <p class="sub">일차별 20문제 · 뜻 고르기 15 + 예문 빈칸 5 · 틀린 단어는 오답노트로</p>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabQuiz" aria-selected="true">퀴즈</button>
    <button class="tab" role="tab" id="tabBook" aria-selected="false">단어장</button>
  </nav>

  <div class="days" id="days" aria-label="일차 선택"></div>

  <section class="panel" id="panelBook" hidden>
    <div class="bookhead">
      <div><h2 id="bookTitle"></h2><span class="hint" id="bookMeta"></span></div>
      <div class="modes" style="align-items:center">
        <label class="toggle"><input type="checkbox" id="hideToggle"> 뜻 가리기</label>
        <button class="btn primary" id="btnDayQuiz">이 날 퀴즈</button>
      </div>
    </div>
    <ol class="book" id="book"></ol>
  </section>

  <section class="panel" id="panelQuiz">
  <section class="stats" aria-label="학습 현황">
    <div class="stat"><small>푼 문제</small><b id="sSolved">0</b></div>
    <div class="stat"><small>정답률</small><b id="sRate">–</b></div>
    <div class="stat"><small>오답노트</small><b id="sWrong">0</b></div>
  </section>

  <div class="modes">
    <button class="btn primary" id="btnNew">새 20문제</button>
    <button class="btn" id="btnReview">오답만 복습</button>
    <button class="btn" id="btnReset">기록 초기화</button>
  </div>

  <main class="sheet" id="sheet" aria-live="polite"></main>
  </section>
  <p class="note">단어 <span class="mono" id="total"></span>개 수록 · 기록은 이 브라우저에만 저장돼요</p>
</div>

<script src="words.js"></script>
<script>
// 일차는 words.js의 day 값으로 나눈다
const DAYS=[...new Set(WORDS.map(w=>w.day))].sort((a,b)=>a-b);
const dayOf=i=>WORDS[i].day;
const dayRange=d=>WORDS.map((_,i)=>i).filter(i=>dayOf(i)===d);

const KEY="toeic-omr-v1";
let store={solved:0,correct:0,wrong:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&typeof s==="object") store=Object.assign(store,s);}catch(e){}
// 단어 목록에 더 이상 없는 오답 기록은 정리한다
for(const k of Object.keys(store.wrong)) if(!WORDS.some(w=>w.w===k)) delete store.wrong[k];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};

const $=id=>document.getElementById(id);
const sheet=$("sheet");
const LETTERS=["A","B","C","D"];
let round=null;

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let view="quiz", day=0, hideMeaning=false;
try{const u=JSON.parse(localStorage.getItem(KEY+"-ui")||"null"); if(u){view=u.view||view; day=u.day??day; hideMeaning=!!u.hide}}catch(e){}
if(day&&!DAYS.includes(day)) day=0;
const saveUi=()=>{try{localStorage.setItem(KEY+"-ui",JSON.stringify({view,day,hide:hideMeaning}))}catch(e){}};
const inScope=i=>day===0||dayOf(i)===day;
const wrongInScope=()=>Object.keys(store.wrong).map(k=>WORDS.findIndex(w=>w.w===k)).filter(i=>i>=0&&inScope(i));

function renderStats(){
  $("sSolved").textContent=store.solved;
  $("sRate").textContent=store.solved?Math.round(store.correct/store.solved*100)+"%":"–";
  $("sWrong").textContent=Object.keys(store.wrong).length;
  const n=wrongInScope().length;
  $("btnReview").disabled=n===0;
  $("btnReview").textContent=day?`${day}일차 오답 복습`:"오답만 복습";
  $("btnNew").textContent=day?`${day}일차 20문제`:"새 20문제";
  $("total").textContent=WORDS.length;
}

function renderDays(){
  const list=(view==="quiz"?[0]:[]).concat(DAYS);
  if(view==="book"&&day===0) day=DAYS[0];
  $("days").innerHTML=list.map(d=>{
    const cnt=d===0?WORDS.length:dayRange(d).length;
    return `<button class="chip" data-d="${d}" aria-pressed="${d===day}">${d===0?"전체":d+"일차"}<small>${cnt}</small></button>`;
  }).join("");
  $("days").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
    day=+b.dataset.d; saveUi(); renderDays(); renderStats();
    if(view==="book") renderBook(); else start(false);
  }));
}

function renderBook(){
  const idx=dayRange(day);
  const wrongN=idx.filter(i=>store.wrong[WORDS[i].w]).length;
  $("bookTitle").textContent=`${day}일차 단어장`;
  $("bookMeta").textContent=`${idx.length}단어 · 오답노트에 있는 단어 ${wrongN}개`;
  $("hideToggle").checked=hideMeaning;
  $("book").classList.toggle("hide-meaning",hideMeaning);
  $("book").innerHTML=idx.map((i,n)=>{
    const w=WORDS[i], miss=store.wrong[w.w];
    return `<li class="entry"><span class="no">${String(n+1).padStart(2,"0")}</span>
      <div class="top"><span class="w">${w.w}</span><span class="pos">${w.pos}</span>${miss?`<span class="tag">오답 ${miss}</span>`:""}</div>
      <button class="meaning" tabindex="${hideMeaning?0:-1}">${w.ko}</button>
      <span class="ex">${w.ex}</span></li>`;
  }).join("");
  $("book").querySelectorAll(".meaning").forEach(b=>b.addEventListener("click",()=>{if(hideMeaning)b.classList.toggle("shown")}));
}

function setView(v){
  view=v; saveUi();
  $("tabQuiz").setAttribute("aria-selected",v==="quiz");
  $("tabBook").setAttribute("aria-selected",v==="book");
  $("panelQuiz").hidden=v!=="quiz";
  $("panelBook").hidden=v!=="book";
  renderDays(); renderStats();
  if(v==="book") renderBook(); else if(!round) start(false);
}

// 한 판 20문제: 앞 15문제는 뜻 고르기, 뒤 5문제는 예문 빈칸
const ROUND=20, BLANKS=5;

// 예문에서 단어를 찾는 정규식. 앞뒤가 알파벳이 아니어야 해서 employee 안의 employ는 잡지 않는다
const wordRe=w=>new RegExp("(?<![A-Za-z])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![A-Za-z])","gi");
const canBlank=i=>wordRe(WORDS[i].w).test(WORDS[i].ex);

// 같은 품사를 앞에 두고 나머지를 뒤에 섞어 붙인다
const byPos=(list,pos)=>shuffle(list.filter(i=>WORDS[i].pos===pos)).concat(shuffle(list.filter(i=>WORDS[i].pos!==pos)));

function makeQuestion(idx){
  const w=WORDS[idx];
  // 같은 품사 오답을 우선 섞어 난이도를 올린다
  const distract=byPos(WORDS.map((_,i)=>i).filter(i=>i!==idx),w.pos).slice(0,3);
  const opts=shuffle([idx,...distract]);
  return {type:"meaning",idx,opts,answer:opts.indexOf(idx)};
}

function makeBlank(idx){
  const w=WORDS[idx];
  const all=WORDS.map((_,i)=>i).filter(i=>i!==idx);
  // 같은 일차 단어만 보기에 나오지 않게 다른 일차 단어를 2개 먼저 넣는다. 다른 일차가 없으면 전체에서 채운다
  const fromOther=byPos(all.filter(i=>WORDS[i].day!==w.day),w.pos).slice(0,2);
  const distract=fromOther.concat(byPos(all.filter(i=>!fromOther.includes(i)),w.pos)).slice(0,3);
  const opts=shuffle([idx,...distract]);
  return {type:"blank",idx,opts,answer:opts.indexOf(idx)};
}

function start(review){
  const pool=shuffle(review?wrongInScope():WORDS.map((_,i)=>i).filter(inScope)).slice(0,ROUND);
  if(!pool.length) return;
  // 문제 수가 20보다 적으면(오답 복습 등) 빈칸 문제도 같은 비율로 줄인다
  const want=Math.floor(pool.length*BLANKS/ROUND);
  const blanks=pool.filter(canBlank).slice(0,want);
  const meanings=pool.filter(i=>!blanks.includes(i));
  const qs=meanings.map(makeQuestion).concat(blanks.map(makeBlank));
  round={day,review,qs,i:0,score:0,missed:[],answered:false};
  renderQ();
}

function renderQ(){
  const q=round.qs[round.i], w=WORDS[q.idx];
  round.answered=false;
  sheet.innerHTML=`
    <div class="qhead"><span>${round.day?round.day+"일차 · ":"전체 · "}${round.review?"오답 복습":"실전 연습"}</span><span class="mono">${round.i+1} / ${round.qs.length}</span></div>
    <div class="progress"><i style="width:${round.i/round.qs.length*100}%"></i></div>
    ${q.type==="blank"
      ?`<p class="qtype">빈칸에 들어갈 단어를 고르세요</p>
        <p class="sentence">${w.ex.replace(wordRe(w.w),'<span class="blank">____</span>')}</p>`
      :`<p class="qtype">알맞은 뜻을 고르세요</p>
        <p class="word">${w.w}<span class="pos">${w.pos}</span></p>`}
    <ul class="choices">${q.opts.map((o,k)=>`<li><button class="choice" data-k="${k}"><span class="bubble">${LETTERS[k]}</span>${q.type==="blank"?`<span class="en">${WORDS[o].w}</span>`:`<span>${WORDS[o].ko}</span>`}</button></li>`).join("")}</ul>
    <div id="fb"></div>
    <p class="hint">키보드 1–4 또는 A–D로 선택 · Enter로 다음</p>`;
  sheet.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
}

function answer(k){
  if(round.answered) return;
  round.answered=true;
  const q=round.qs[round.i], w=WORDS[q.idx], ok=k===q.answer;
  const btns=sheet.querySelectorAll(".choice");
  btns.forEach(b=>b.disabled=true);
  btns[q.answer].classList.add("correct");
  if(!ok) btns[k].classList.add("wrong");
  store.solved++;
  if(ok){store.correct++;round.score++; if(round.review) delete store.wrong[w.w];}
  else{store.wrong[w.w]=(store.wrong[w.w]||0)+1; round.missed.push(q.idx);}
  save(); renderStats();
  const last=round.i===round.qs.length-1;
  $("fb").innerHTML=`<div class="feedback">
      <span class="verdict ${ok?"ok":"no"}">${ok?"정답!":"오답 · 정답은 ("+LETTERS[q.answer]+") "+(q.type==="blank"?w.w:w.ko)}</span>
      <span class="ex">${q.type==="blank"?w.ex.replace(wordRe(w.w),m=>`<b>${m}</b>`):w.ex}</span><span class="ex-ko">${w.exKo}</span>
      <div class="row"><span class="hint">${!ok?"오답노트에 추가됨":round.review?"오답노트에서 삭제됨":""}</span>
      <button class="btn primary" id="next">${last?"결과 보기":"다음 문제"}</button></div></div>`;
  $("next").addEventListener("click",next);
  $("next").focus();
}

function next(){
  if(round.i<round.qs.length-1){round.i++;renderQ()}
  else renderResult();
}

function renderResult(){
  const r=round;
  sheet.innerHTML=`<div class="result">
    <span class="hint">${r.review?"오답 복습":"실전 연습"} 결과</span>
    <div class="score">${r.score}<span style="font-size:28px;color:var(--muted)"> / ${r.qs.length}</span></div>
    ${r.missed.length?`<div class="missed"><span class="hint">이번에 틀린 단어</span>${r.missed.map(i=>`<div><span class="mono">${WORDS[i].w}</span><span>${WORDS[i].ko}</span></div>`).join("")}</div>`:`<p>전부 맞혔어요.</p>`}
    <div class="modes" style="justify-content:center">
      <button class="btn primary" id="again">${day?day+"일차 ":"새 "}20문제</button>
      ${wrongInScope().length?`<button class="btn" id="rev">오답만 복습</button>`:""}
    </div></div>`;
  round=null;
  $("again").addEventListener("click",()=>start(false));
  if($("rev")) $("rev").addEventListener("click",()=>start(true));
}

let resetArmed=false;
$("btnNew").addEventListener("click",()=>start(false));
$("btnReview").addEventListener("click",()=>start(true));
$("btnReset").addEventListener("click",e=>{
  if(!resetArmed){resetArmed=true;e.target.textContent="한 번 더 누르면 초기화";setTimeout(()=>{resetArmed=false;e.target.textContent="기록 초기화"},3000);return}
  store={solved:0,correct:0,wrong:{}};save();renderStats();resetArmed=false;e.target.textContent="기록 초기화";start(false);
});
$("tabQuiz").addEventListener("click",()=>setView("quiz"));
$("tabBook").addEventListener("click",()=>setView("book"));
$("hideToggle").addEventListener("change",e=>{hideMeaning=e.target.checked;saveUi();renderBook()});
$("btnDayQuiz").addEventListener("click",()=>{setView("quiz");start(false)});
document.addEventListener("keydown",e=>{
  if(!round||view!=="quiz") return;
  const map={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};
  const k=map[e.key.toLowerCase()];
  if(!round.answered&&k!==undefined) answer(k);
  else if(round.answered&&e.key==="Enter"&&document.activeElement.id!=="next") next();
});

setView(view);
if(!round) start(false);
</script>
</body>
</html>
